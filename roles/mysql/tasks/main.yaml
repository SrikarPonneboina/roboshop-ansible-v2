- name: enable mysql version 8.4
  command: dnf module enable mysql:8.4 -y

- name: install mysql server
  dnf:
    name: mysql-server
    state: present

- name: enable and start mysql server
  service:
    name: mysqld
    state: started
    enabled: true
  
- name: set root password for mysql server
  shell: mysql_secure_installation --set-root-pass {{ mysql_root_password }}